Version: 8
Name: Dummy Segmentation
Description: Dummy model for the public demo
Type: NeuralNetwork
PredictionOutput: [Image]   # The prediction output is an image like the input. Supported outputs are [Image, Vector, Keypoints, BoundingBoxes]
PredictionType: [Classification]    # Semantic segmentation is a classification problem for every pixel in the input Image. Possible types are [Classification, Regression]
Verbose: false  # Controls the verbosity level of model logging
MaxBatchSize: 1
CloneInputContainer: false

#############################################################################################
# Configure the backend framework to be used as Engine to perform the actual inference
#############################################################################################
Engine:   # Specifies with backend framework needs to be used to run the trained/saved/traced model
  Name: onnx    # Could be [torch, onnx, tensorrt] from a C++ plugin, or a python engine [pytorch, pyonnxruntime, pyopenvino, coreml, or any custom engine]
  ModelFile: demo_model.onnx # Path to the actual model file (could be a onnx file), either relative to the current working directory or an absolute path
  ForceCPU: false   # Set it to true if you want to perform the inference on the CPU instead of the GPU
  Verbose: false

#############################################################################################
# Sequence of preprocessing operations run before the network
# (all available operations are available in the Python documentation of the SDK)
#############################################################################################
PreProcessing:
- MakeFloat: {}
# Normalize the image intensity values using percentile-based scaling
- NormalizePercentile:
    clamp_values: 0
    ignore_zeros: 0
    max_percentile: 0.99
    min_percentile: 0.01
    processing_policy: 0
# Resample the image to a fixed resolution of 3.0mm
- Resample:
    resolution: [3.0, 3.0, 3.0]
# If the image has a non-identity rotation matrix, bake the transformation to the image voxels
# This is necessary because the engine implementation input is typically a tensor object, without any
# notion of the image coordinate system.
- BakeTransformation: {}
# For pixelwise (fully convolutional) models, it might be necessary to split the input in sub-images
# because of GPU memory constraints, especially for 3D volumes.
# Each of those images will be fed into the network and the predictions will be recombined.
# This operation can be removed for imagewise models.
- SplitIntoPatches:
    padding_mode: clamp
    patch_size: [64, 64, 64]
    patch_step_size: 0.8

#############################################################################################
# Sequence of preprocessing operations run
# after the network and the recombination of the sub-images
# (all available operations are available in the Python documentation of the SDK)
#############################################################################################
PostProcessing:
# Recombine the patches into a single prediction image
- RecombinePatches:
    mode: Weighted     
# Convert the multi-channel probability map to a label map
- ArgMax: {}    
# Resample the prediction image back to the original image
- ResampleToInput: {}
